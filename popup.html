<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My Extension</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
      margin-top: 0;
      font-size: 20px;
    }
    #btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }
    #btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>Hello Extension</h1>

  <button id="btn">
    Click me
  </button>

  <script src="popup.js"></script>

</body>
</html>
